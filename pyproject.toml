[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensmovie"
version = "0.1.0"
description = "Interactive Qt GUI to visualize gravitational lensing with lenstronomy (2D image plane + 3D scene)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cyan", email = "47052542+Cywtim@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyQt5",
    "lenstronomy",
    "vispy",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lensmovie = "app.main:entry"

[tool.pytest.ini_options]
# Always add the project root to sys.path so `import app` works no matter where
# pytest is invoked from (root, tests/, or elsewhere).
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: tests that run a full PSO fit (deselect with -m 'not slow')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
